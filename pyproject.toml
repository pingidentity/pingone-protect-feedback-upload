[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pingone-protect-feedback-upload"
version = "0.1.0"
description = "Bulk upload PingOne Protect risk feedback labels via the pingcli risk-feedback command"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ping Identity Corporation" }]
keywords = ["pingidentity", "pingone", "protect", "risk-feedback", "pingcli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# Stdlib only by design: customers install one tool, not a dependency tree.
dependencies = []

[project.urls]
PingCLI = "https://github.com/pingidentity/pingcli"

[project.scripts]
protect-feedback-upload = "protect_feedback_upload.__main__:main"

[tool.setuptools.packages.find]
include = ["protect_feedback_upload*"]
